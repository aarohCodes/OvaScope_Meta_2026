# Local-only stack: every port binds to 127.0.0.1. Do not expose publicly without
# OVASCOPE_DEPLOYMENT=public + OVASCOPE_API_TOKEN and a reviewed deletion process.
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up --build
name: ovascope

x-api-env: &api-env
  OVASCOPE_DATABASE_URL: postgresql+psycopg://ovascope:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/ovascope
  OVASCOPE_ARTIFACT_DIR: /data/artifact_store
  OVASCOPE_BUNDLES_DIR: /app/artifacts/bundles
  OVASCOPE_EVALUATION_DIR: /app/artifacts/evaluation
  OVASCOPE_MMOTU_ROOT: /app/data/raw/mmotu_hf
  OVASCOPE_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  OVASCOPE_DEPLOYMENT: ${OVASCOPE_DEPLOYMENT:-local}
  OVASCOPE_API_TOKEN: ${OVASCOPE_API_TOKEN:-}
  OVASCOPE_RETENTION_HOURS: ${OVASCOPE_RETENTION_HOURS:-24}
  OVASCOPE_INFERENCE_MODE: ${OVASCOPE_INFERENCE_MODE:-auto}
  OVASCOPE_SERVE_EVAL_IMAGES: ${OVASCOPE_SERVE_EVAL_IMAGES:-false}

x-api-volumes: &api-volumes
  - ./artifacts:/app/artifacts:ro
  - ./data/raw/mmotu_hf:/app/data/raw/mmotu_hf:ro
  - ${HF_CACHE_DIR:-~/.cache/huggingface}:/home/ovascope/.cache/huggingface:ro
  - store:/data

services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ovascope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ovascope
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovascope -d ovascope"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment:
      <<: *api-env
      OVASCOPE_INLINE_WORKER: "false"
    volumes: *api-volumes
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["python", "-m", "ovascope_worker.main"]
    environment:
      <<: *api-env
      OVASCOPE_AUTO_MIGRATE: "false"
    volumes: *api-volumes
    depends_on: { api: { condition: service_healthy } }
    healthcheck: { disable: true }

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      OVASCOPE_API_INTERNAL_URL: http://api:8000
      OVASCOPE_API_TOKEN: ${OVASCOPE_API_TOKEN:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  pgdata:
  store:
