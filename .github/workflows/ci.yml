name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install (hash-pinned lock, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/lock.txt
          pip install --no-deps -e .
      - name: Refuse committed data or images
        run: python tasks.py check-no-data
      - name: Ruff
        run: ruff check ml services tests scripts tasks.py
      - name: Mypy
        run: mypy
      - name: Pytest (slow and dataset tests skip without weights/data)
        run: pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.20.0", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22.20.0", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Python env
        run: |
          python -m venv .venv
          .venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/lock.txt
          .venv/bin/pip install --no-deps -e .
      - name: Web build + browsers
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Playwright (NO_MODEL mode; no weights or data in CI)
        working-directory: apps/web
        run: npx playwright test
        env: { E2E_MODE: no_model }
